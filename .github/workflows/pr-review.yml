# 人間が作った PR を Claude がレビューする。
#
# 実体は再利用可能ワークフローに切り出してある。
#   https://github.com/tamura09/claude-pr-review
#
# レビューを投稿するだけで、マージも承認もしない。判断するのは人間。
#
# レビューされない PR が2種類ある。
#   - fork からの PR。GitHub が secrets も id-token も渡さないため、この経路では
#     起動できない。呼び出し先が head.repo をみて明示的にスキップする
#   - Dependabot の PR。同じ制限を受けるので、既定の skip_authors に入っている
#
# OAuth トークンはこのリポジトリの secret には置かない。AWS の SSM
# (/claude-pr-review/oauth-token) に1本だけ置いてあり、呼び出された
# ワークフローが OIDC で読む。下の id-token: write がそのために要る。
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 呼び出される側の permissions は呼び出し側を超えられないため、ここで明示する
permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-review チェックを PR のチェック一覧に出すため
  statuses: write
  # OAuth トークンを SSM から読むための OIDC トークン発行
  id-token: write
  # CI の実行結果を Claude に読ませるため (github_ci MCP に必要)
  actions: read

# 連続 push のたびに走らせず、最新のコミットだけレビューする
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # コミット SHA で固定している。末尾の `# v1` はその SHA が今どのタグを
    # 指しているかの注記で、参照しているのは SHA のほう。
    #
    # 呼び出し先には id-token: write を渡す。タグ参照のままだと、タグを
    # 書き換えられた時点でそれがそのまま OAuth トークンの流出になる。
    #
    # 固定したままだと上流の修正が届かなくなるので、digest の追随は Renovate の
    # 共有プリセット (helpers:pinGitHubActionDigests) に任せる。固定と追随は
    # セットで、片方だけにはしない。
    uses: tamura09/claude-pr-review/.github/workflows/pr-review.yml@ccdfd9dc973f75f844af101be1d0bc7a170cbcf0 # v1
